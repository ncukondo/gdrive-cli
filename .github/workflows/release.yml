name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - run: bun install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(jq -r .version package.json)"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - run: bun run typecheck
      - run: bun run lint
      - run: bun run lint:casts
      - run: bun run format:check
      - run: bun run test:all

      - name: Build npm distribution
        run: bun run build

      - name: Smoke-test the npm package as installed
        run: |
          node dist/index.js --version
          # Install the real tarball and run the linked bin: npm links
          # node_modules/.bin/gdrive at dist/index.js, and only that path
          # exercises the entry-point check.
          npm pack --pack-destination /tmp
          mkdir -p /tmp/installcheck && cd /tmp/installcheck
          npm install /tmp/ncukondo-gdrive-cli-*.tgz
          ./node_modules/.bin/gdrive --version
          ./node_modules/.bin/gdrive --help | grep -q "Google Drive"

      - name: Compile release binaries
        run: bun run build:release

      - name: Smoke-test the native binary
        run: |
          out/gdrive-linux-x64 --version
          # The tag being released is not published yet, so upgrade can only be
          # smoke-tested for "it runs", not for its exit status.
          out/gdrive-linux-x64 upgrade --dry-run || true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* install.sh install.ps1 \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: Publish to npm (trusted publishing)
        run: |
          # OIDC trusted publishing requires npm >= 11.5.1; Node 22 bundles npm 10
          npm install -g npm@latest
          npm publish --access public --provenance
